# Configuração Nginx para studesk.pro
# Detecta automaticamente mobile vs desktop e redireciona para a aplicação correta

# Mapa para detectar dispositivos mobile baseado no User-Agent
map $http_user_agent $is_mobile {
    default 0;
    ~*android 1;
    ~*iphone 1;
    ~*ipad 1;
    ~*ipod 1;
    ~*mobile 1;
    ~*webos 1;
    ~*blackberry 1;
    ~*opera\ mini 1;
    ~*opera\ mobi 1;
    ~*windows\ phone 1;
}

# Upstream para backend (versão web)
upstream backend_web {
    server 127.0.0.1:3030;
}

# Upstream para mobile PWA
upstream backend_mobile {
    server 127.0.0.1:3031;
}

# Servidor HTTP (porta 80) - Redireciona para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name studesk.pro www.studesk.pro;

    # Redirecionar todo tráfego HTTP para HTTPS
    return 301 https://studesk.pro$request_uri;
}

# Servidor HTTPS (porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studesk.pro www.studesk.pro;

    # Certificados SSL (serão configurados pelo Certbot)
    ssl_certificate /etc/letsencrypt/live/studesk.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studesk.pro/privkey.pem;

    # Configurações SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/studesk-access.log;
    error_log /var/log/nginx/studesk-error.log;

    # Tamanho máximo de upload (para PDFs)
    client_max_body_size 100M;

    # Localização principal - detecta mobile vs desktop
    location / {
        # Se for mobile, usa o backend mobile (PWA)
        if ($is_mobile) {
            proxy_pass http://backend_mobile;
        }

        # Se não for mobile, usa o backend web
        proxy_pass http://backend_web;

        # Headers para proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Para arquivos estáticos Next.js
    location /_next/static {
        if ($is_mobile) {
            proxy_pass http://backend_mobile;
        }
        proxy_pass http://backend_web;

        # Cache para arquivos estáticos
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Para service worker do PWA (sempre servir da versão mobile)
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.json)$ {
        proxy_pass http://backend_mobile;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Não cachear service workers
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
